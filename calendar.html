<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>獲得カレンダー</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/card-refresh.css">
    <link rel="stylesheet" href="css/calendar.css">
</head>
<body>
    <!-- モバイルヘッダー -->
    <header class="mobile-header">
        <div class="mobile-header-content">
            <img src="https://via.placeholder.com/150" alt="Profile" class="mobile-profile-image" id="mobile-menu-toggle">
            <div class="mobile-header-text">
                <h1 class="mobile-blog-title">開拓日誌</h1>
                <p class="mobile-blog-description">でっけぇ開拓、で開拓</p>
            </div>
        </div>
    </header>

    <!-- オーバーレイ -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="layout-container">
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-close" id="sidebar-close">×</button>
            <div class="sidebar-content">
                <div class="profile-section">
                    <img src="https://via.placeholder.com/150" alt="Profile" class="profile-image">
                    <h1 class="blog-title">開拓日誌</h1>
                    <p class="profile-bio">
                        でっけぇ開拓、で開拓
                    </p>
                </div>
                <nav class="sidebar-nav">
                    <a href="index.html" class="nav-link">ホーム</a>
                    <a href="calendar.html" class="nav-link">獲得カレンダー</a>
                    <a href="admin.html" class="nav-link">新規投稿</a>
                    <a href="post.html" class="nav-link">記事管理</a>
                    <a href="settings.html" class="nav-link">設定</a>
                </nav>
            </div>
        </aside>

        <main class="main-content">
            <div class="calendar-wrap">
                <h1 class="calendar-page-title">獲得カレンダー</h1>

                <!-- 月ナビゲーション -->
                <div class="calendar-nav">
                    <button type="button" id="cal-prev" class="cal-nav-btn" aria-label="前の月">‹</button>
                    <span id="cal-current" class="cal-current"></span>
                    <button type="button" id="cal-next" class="cal-nav-btn" aria-label="次の月">›</button>
                    <button type="button" id="cal-today" class="cal-today-btn">今月</button>
                </div>

                <div id="cal-loading" class="cal-loading">読み込み中...</div>
                <div id="cal-error" class="cal-error" style="display:none;">データの読み込みに失敗しました。</div>

                <!-- カレンダー本体 -->
                <div id="calendar-grid" class="calendar-grid" style="display:none;"></div>

                <!-- 選択した日の詳細 -->
                <div id="day-detail" class="day-detail" style="display:none;"></div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/calendar.js"></script>
</body>
</html>
