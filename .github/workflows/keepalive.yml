name: Keep Supabase Active

on:
  schedule:
    # 毎日日本時間の朝9時に実行（UTC 0:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能

# 自動コミット（リポジトリ活動の発生）に必要
permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Supabase client
        run: npm install @supabase/supabase-js
        
      - name: Update Keepalive Table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_ANON_KEY
          );
          
          async function keepAlive() {
            try {
              // まず現在のping_countを取得
              const { data: current, error: fetchError } = await supabase
                .from('keepalive')
                .select('ping_count')
                .eq('id', 1)
                .single();
              
              const currentCount = current ? (current.ping_count || 0) : 0;
              
              // keepaliveテーブルの最新レコードを更新
              const { data, error } = await supabase
                .from('keepalive')
                .upsert({ 
                  id: 1,
                  last_ping: new Date().toISOString(),
                  ping_count: currentCount + 1
                })
                .select();
              
              if (error) {
                console.error('Error updating keepalive:', error);
                process.exit(1);
              }
              
              console.log('Successfully updated keepalive table:', data);
              
              // ついでに記事数も取得してデータベースが動いていることを確認
              const { count } = await supabase
                .from('posts')
                .select('*', { count: 'exact', head: true });
                
              console.log('Total posts in database:', count);
              
            } catch (err) {
              console.error('Unexpected error:', err);
              process.exit(1);
            }
          }
          
          keepAlive();
          "

      - name: Keep repository active (prevent 60-day auto-disable)
        run: |
          # スケジュール実行はリポジトリ活動として扱われず、コミットが60日
          # 途絶えるとワークフローが自動停止される。それを防ぐため、最終コミット
          # から50日以上経過している場合のみ、活動記録ファイルを更新して push する。
          LAST_COMMIT_EPOCH=$(git log -1 --format=%ct)
          NOW_EPOCH=$(date +%s)
          DAYS_SINCE=$(( (NOW_EPOCH - LAST_COMMIT_EPOCH) / 86400 ))
          echo "最終コミットからの経過日数: ${DAYS_SINCE}日"
          if [ "$DAYS_SINCE" -ge 50 ]; then
            echo "50日以上コミットがないため、活動記録を更新してコミットします。"
            date -u +'%Y-%m-%dT%H:%M:%SZ' > docs/keepalive-activity.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/keepalive-activity.txt
            git commit -m "chore: keepalive リポジトリ活動更新（60日自動停止の回避）"
            git push
          else
            echo "最近コミットがあるため、コミットはスキップします。"
          fi